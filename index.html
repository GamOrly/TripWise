<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Trips · Tripwise</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/pages/index.js"></script>
</head>
<body>
<main class="page" id="page" hidden>
  <header class="tw-appheader">
    <p class="tw-wordmark">Tripwise</p>
    <div class="page__actions" id="header-actions">
      <button type="button" class="tw-btn tw-btn--text tw-btn--sm" id="sign-out">Sign out</button>
      <button type="button" class="tw-btn tw-btn--primary tw-btn--sm" id="create-trip"></button>
    </div>
  </header>
  <h1 class="page__title">My Trips</h1>
  <div class="tw-stack" id="trips"></div>
  <div class="tw-empty" id="empty" hidden>
    <div class="tw-empty__art" aria-hidden="true">
      <div class="tw-empty__disc"></div>
      <div class="tw-empty__tile" id="empty-tile"></div>
      <div class="tw-empty__badge" id="empty-badge"></div>
    </div>
    <p class="tw-empty__title">No trips yet.</p>
    <button type="button" class="tw-btn tw-btn--primary tw-btn--md" id="create-trip-empty"></button>
  </div>
</main>
</body>
</html>
